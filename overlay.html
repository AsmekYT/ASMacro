<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASMacro click markers</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      #markers { position: relative; width: 100%; height: 100%; }
      .marker {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        border: 2px solid #00c2ff;
        background: rgba(0, 194, 255, 0.18);
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 600 12px/22px system-ui, sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .marker.active {
        border-color: #ff3b30;
        background: rgba(255, 59, 48, 0.32);
        transform: scale(1.25);
      }
      .marker.single { border-color: #ffd400; background: rgba(255, 212, 0, 0.22); }
      .marker::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 2px;
        margin: -1px 0 0 -1px;
        border-radius: 50%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="markers"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
