[package]
name = "asmacro"
version = "1.0.2"
description = "Screen-automation macro editor built on Blockly"
authors = ["Asmek <asmek.yt@gmail.com>"]
license = "AGPL-3.0-or-later WITH Commons-Clause"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"
rayon = "1"

[target.'cfg(windows)'.dependencies]
enigo = "0.6"
screenshots = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Dwm",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Win32_System_Registry",
    "Win32_Globalization",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
nix = { version = "0.29", features = ["poll", "event"] }
x11rb = { version = "0.13", default-features = false, features = ["randr"] }
xkbcommon = "0.8"
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
