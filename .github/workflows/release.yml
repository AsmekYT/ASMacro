name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  version:
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          line="$(head -n1 <<<"$MSG")"
          if [[ "$line" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.parse.outputs.version != ''
        with:
          fetch-depth: 0

      - name: Draft release with changelog
        if: steps.parse.outputs.version != ''
        shell: bash
        run: |
          tag="v${{ steps.parse.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          git log --no-merges --pretty='- %s' ${prev:+"$prev..HEAD"} \
            | { grep -Ev '^- v[0-9]+\.[0-9]+\.[0-9]+' || true; } | head -n 100 > notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ASMacro $tag" --notes-file notes.md

  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          sed -i '0,/"version":/s/"version": *"[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i "0,/^version = /s/^version = .*/version = \"$VERSION\"/" installer/setup/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build ASMacro.exe
        run: npx tauri build --no-bundle

      - name: Build setup stub + asm-pack
        shell: bash
        run: |
          cargo build --release --manifest-path installer/Cargo.toml -p asmacro-setup -p asm-pack
          stub=installer/target/release/asmacro-setup.exe
          uninst=installer/target/release/uninstall.exe
          cp "$stub" "$uninst"
          out="ASMacro_${VERSION}_x64-setup.exe"
          installer/target/release/asm-pack \
            --stub "$stub" \
            --add "ASMacro.exe=src-tauri/target/release/ASMacro.exe" \
            --add "uninstall.exe=$uninst" \
            --out "$out"
          echo "SETUP_FILE=$out" >> "$GITHUB_ENV"

      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$SETUP_FILE"

      - name: Self-check (silent install/uninstall round trip)
        shell: bash
        timeout-minutes: 5
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          dir="$RUNNER_TEMP/asmacro-ci-install"
          "./$SETUP_FILE" /S --scope=user --dir="$dir" --autostart=0
          test -f "$dir/ASMacro.exe"
          test -f "$dir/uninstall.exe"
          "$dir/uninstall.exe" /S
          test ! -f "$dir/ASMacro.exe"

      - name: Upload
        shell: bash
        run: gh release upload "v$VERSION" "$SETUP_FILE" "$SETUP_FILE.sig" --clobber

  linux:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          sed -i '0,/"version":/s/"version": *"[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            libxkbcommon-dev libdbus-1-dev desktop-file-utils file \
            pkg-config build-essential

      - run: npm ci

      - name: Build deb, rpm, AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Upload
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f -name "*$VERSION*" \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) -print0 \
            | xargs -0 -t gh release upload "v$VERSION" --clobber

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Build and upload latest.json
        shell: bash
        run: |
          tag="v$VERSION"
          base="https://github.com/$GH_REPO/releases/download/$tag"
          gh release download "$tag" -D sigs -p '*.sig'
          jq -n --arg v "$VERSION" --arg d "$(date -u +%FT%TZ)" --arg n "$(gh release view "$tag" --json body -q .body)" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {}}' > latest.json
          for s in sigs/*.sig; do
            f="$(basename "${s%.sig}")"
            case "$f" in
              *-setup.exe) k=windows-x86_64 ;;
              *.AppImage)  k=linux-x86_64 ;;
              *.deb)       k=linux-x86_64-deb ;;
              *.rpm)       k=linux-x86_64-rpm ;;
              *) continue ;;
            esac
            jq --arg k "$k" --arg s "$(cat "$s")" --arg u "$base/$f" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > t.json && mv t.json latest.json
          done
          cat latest.json
          jq -e '.platforms["windows-x86_64"] and .platforms["linux-x86_64"]' latest.json
          gh release upload "$tag" latest.json --clobber
          gh release edit "$tag" --draft=false --latest
